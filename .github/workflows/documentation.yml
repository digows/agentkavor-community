name: Documentation

on:
  pull_request_target:
    paths:
      - docs/**
      - CONTRIBUTING.md
  push:
    branches:
      - main
    paths:
      - docs/**
      - scripts/validate-docs.mjs
      - scripts/validate-docs.test.mjs
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-pull-request:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted validator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Install trusted validator dependencies
        working-directory: trusted
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download pull request source as data
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          mkdir pull-request-source
          gh api "repos/${HEAD_REPOSITORY}/tarball/${HEAD_SHA}" > pull-request.tar.gz
          tar --extract --gzip --file pull-request.tar.gz --directory pull-request-source --strip-components=1

      - name: Validate contributed documentation with trusted code
        run: node trusted/scripts/validate-docs.mjs --source pull-request-source/docs --base-source trusted/docs

      - name: Validate approved editorial release metadata
        if: contains(github.event.pull_request.labels.*.name, 'editorial-release')
        run: node trusted/scripts/validate-editorial-pr.mjs --source pull-request-source/docs --base-source trusted/docs --event "${GITHUB_EVENT_PATH}"

  validate-main:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate documentation
        run: pnpm docs:validate

      - name: Test validator failure modes
        run: pnpm test
